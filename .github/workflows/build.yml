name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # 静态检查：护栏 + lint（不启动 GUI）
  #
  # 【为什么跑在 macOS 而不是 ubuntu】`wails3 generate bindings` 要对整个 Go 项目
  # 做类型检查；Wails 的 application 包在 Linux 上依赖 GTK/WebKit 头文件，ubuntu
  # runner 默认没有，生成阶段就会失败。而 frontend/bindings/ 是不入库的生成产物，
  # 干净检出里必须先生成，vue-tsc / vite build 才能解析 import。
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # wails3 CLI 版本取自 go.mod（CLI 与依赖库必须同版本），与 build job 一致。
      - name: Install wails3 CLI (version from go.mod)
        run: |
          set -euo pipefail
          V="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          echo "wails3 CLI 版本（取自 go.mod）: $V"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${V}"
          wails3 version

      # 【必须在 npm run build 之前】frontend/bindings/** 由 app.go 的导出方法生成，
      # 且被 gitignore。缺了它，vue-tsc 会报几十条
      # `Cannot find module '../../bindings/morrow/app.js'`。
      - name: Generate Go↔TS bindings
        run: wails3 generate bindings -clean=true -ts

      - name: Install frontend deps
        run: cd frontend && npm install

      # 必须先构建前端：根包（main.go）用 //go:embed 嵌入 frontend/dist，
      # 而该目录被 gitignore —— 干净检出里没有它，编译根包会失败：
      #   `pattern all:frontend/dist: no matching files found`
      - name: Build frontend (供 go:embed 使用)
        run: cd frontend && npm run build

      - name: Run tests (含护栏)
        run: make test

      - name: Run lint
        run: make lint

  # 编译矩阵（只编译，不启动 GUI）。
  #
  # macOS + Windows + Linux 三平台编译；Windows 腿的步骤必须显式 shell: bash——
  # runner 默认 PowerShell 会把 `set -euo pipefail` 当成 Set-Variable 参数。
  # 打包入口直接调 scripts/build.sh（make 在 Windows runner 上不保证存在），
  # 与本地 make build 共用同一个构建实现。
  #
  # Linux 只做【编译腿】：v3.0.0 默认 GTK4 + WebKitGTK 6.0，runner 上装对应
  # 开发包即可编译；但 Linux 不在发布矩阵内（release.yml 只打包 macOS/Windows），
  # 运行态仍需在目标发行版上人工确认。
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Linux 腿需要 GTK4 / WebKitGTK 6.0 的开发包：wails3 CLI 自身的编译、
      # 绑定生成与 cgo 编译都依赖 pkg-config 能找到它们。只装开发包，不打包、不运行。
      # 【必须在 Install wails3 CLI 之前】CLI 会编译到 application 包，缺头文件会先炸。
      - name: Install Linux deps (GTK4 + WebKitGTK 6.0)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      # 装 wails3 CLI。版本【取自 go.mod】而不是写死：CLI 与依赖库必须同版本，
      # 写死会出现「go.mod 升了、CI 还在用旧 CLI」的静默错配——症状是 CI 的构建
      # 方式与本地不一致，而两边都「成功」。go.mod 是 wails 版本的唯一真相。
      # 注意可执行名是 wails3（v2 的 CLI 叫 wails，两者不通用）。
      - name: Install wails3 CLI (version from go.mod)
        shell: bash
        run: |
          set -euo pipefail
          V="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          echo "wails3 CLI 版本（取自 go.mod）: $V"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${V}"
          wails3 version

      - name: Install frontend deps
        shell: bash
        run: cd frontend && npm install

      - name: Build
        shell: bash
        run: bash scripts/build.sh

      # 生成器端到端验证：连生 2 个模块 → 生成 bindings → 编译 → gofmt → 护栏。
      # 这是本仓唯一的端到端检查，历史上抓到过 3 个真实 bug（缺 import / 注入非幂等 /
      # 产物不符 gofmt），此前只在本地跑、靠人记得。
      # 只跑一次即可（检查内容与平台无关）；放在 macos 腿是因为 Windows runner 无 rsync。
      - name: Generator end-to-end (verify-gen)
        if: matrix.os == 'macos-latest'
        run: make verify-gen

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: build/bin/
